<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Dark Sphere Lighting & Tactical Volume -->
    <radialGradient id="darkSphereVolume" cx="30%" cy="26%" r="76%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="85%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050B18"/>
    </radialGradient>

    <!-- Center Pentagon (Vibrant Tactical Emerald Glow) -->
    <linearGradient id="emeraldDarkPentGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Top Left Pentagon (Deep Analytics Teal / Cyan Core) -->
    <linearGradient id="tealDarkPentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="60%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <!-- Top Right Pentagon (Cobalt / Midnight Ocean) -->
    <linearGradient id="cobaltDarkPentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <!-- Subtle AI Luminescent Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="ballSphereClip">
      <circle cx="250" cy="250" r="236"/>
    </clipPath>

    <!-- Pentagon Clips -->
    <clipPath id="centerPentagonClip">
      <path d="M196,252 L306,266 L348,372 L264,424 L172,352 Z"/>
    </clipPath>

    <clipPath id="topLeftPentagonClip">
      <path d="M116,68 L206,104 L148,188 L48,172 L46,88 Z"/>
    </clipPath>

    <clipPath id="topRightPentagonClip">
      <path d="M374,70 L452,112 L424,188 L330,182 L292,94 Z"/>
    </clipPath>
  </defs>

  <!-- Outer Ambient Glow Ring for dark backgrounds -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.35"/>
  <circle cx="250" cy="250" r="238" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.3"/>

  <!-- Base Ball Sphere (Deep Tactical Obsidian Shell) -->
  <circle cx="250" cy="250" r="236" fill="url(#darkSphereVolume)" stroke="#334155" stroke-width="7"/>

  <!-- Ball Panels Group -->
  <g clip-path="url(#ballSphereClip)">

    <!-- ==================== HEXAGON PANELS (Inverted Dark Slate with Crisp Seams) ==================== -->
    
    <!-- Top Apex Hexagon -->
    <path d="M206,104 L248,22 L292,94 L228,142 Z" fill="#1E293B" stroke="#475569" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Center-Top Hexagon Panel -->
    <path d="M228,142 L292,94 L330,182 L306,266 L196,252 L148,188 Z" fill="#131F33" stroke="#475569" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Tactical elevation contour lines (Glowing subtle Cyan / Mint) -->
    <path d="M178,216 Q234,188 280,222" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <path d="M192,234 Q244,212 294,242" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- Left Flank Hexagon Panel -->
    <path d="M48,172 L148,188 L196,252 L172,352 L78,326 L46,244 Z" fill="#111C2E" stroke="#475569" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Radar coordinates & grid dots -->
    <circle cx="106" cy="242" r="2" fill="#38BDF8" opacity="0.8"/>
    <circle cx="132" cy="226" r="2.5" fill="#34D399" opacity="0.9"/>
    <circle cx="120" cy="276" r="2" fill="#38BDF8" opacity="0.8"/>
    <path d="M106,242 L132,226 L120,276" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.7"/>

    <!-- Right Flank Hexagon Panel -->
    <path d="M330,182 L424,188 L448,272 L422,348 L348,372 L306,266 Z" fill="#142137" stroke="#475569" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M344,296 Q378,272 408,308" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <path d="M358,324 Q386,302 414,330" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- Bottom Left Seam Hexagon -->
    <path d="M78,326 L172,352 L264,424 L196,474 L102,428 Z" fill="#0F172A" stroke="#475569" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Bottom Right Seam Hexagon -->
    <path d="M348,372 L422,348 L440,432 L368,474 L264,424 Z" fill="#0F172A" stroke="#475569" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Far Edge Bottom Rim -->
    <path d="M196,474 L264,424 L368,474 C314,498 250,498 196,474 Z" fill="#070D18" stroke="#334155" stroke-width="3.5"/>


    <!-- ==================== PENTAGON 1: CENTER (Tactical Emerald with Glowing Ascending Charts) ==================== -->
    <g id="centerPentagonGroup">
      <!-- Base Pentagon Fill -->
      <path d="M196,252 L306,266 L348,372 L264,424 L172,352 Z" fill="url(#emeraldDarkPentGrad)" stroke="#10B981" stroke-width="3.5" stroke-linejoin="round"/>

      <g clip-path="url(#centerPentagonClip)">
        <!-- Horizontal Grid Reference Guides -->
        <line x1="170" y1="365" x2="350" y2="365" stroke="#10B981" stroke-width="1" stroke-dasharray="2,4" opacity="0.4"/>
        <line x1="170" y1="330" x2="350" y2="330" stroke="#10B981" stroke-width="1" stroke-dasharray="2,4" opacity="0.4"/>
        <line x1="170" y1="295" x2="350" y2="295" stroke="#10B981" stroke-width="1" stroke-dasharray="2,4" opacity="0.4"/>

        <!-- Inverted Glowing Ascending Statistical Bars -->
        <!-- Bar 1 -->
        <path d="M202,390 L202,360 Q210,358 218,360 L218,398 Z" fill="#34D399" opacity="0.9"/>
        <!-- Bar 2 -->
        <path d="M224,402 L224,334 Q232,332 240,334 L240,410 Z" fill="#10B981"/>
        <!-- Bar 3 -->
        <path d="M246,415 L246,312 Q254,310 262,312 L262,420 Z" fill="#059669"/>
        <!-- Bar 4 -->
        <path d="M268,420 L268,288 Q276,286 284,288 L284,418 Z" fill="#38BDF8"/>
        <!-- Bar 5 (Peak High Bar) -->
        <path d="M290,414 L290,268 Q298,266 306,268 L306,400 Z" fill="#0EA5E9" filter="url(#neonGlow)"/>

        <!-- Luminescent Trend Trajectory Curve -->
        <path d="M190,378 C215,355 240,326 270,300 C285,286 295,272 302,268" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

        <!-- Glowing Apex AI Node (Cyan Telemetry Dot) -->
        <circle cx="302" cy="268" r="6" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2" filter="url(#neonGlow)"/>
        <circle cx="302" cy="268" r="2.5" fill="#FFFFFF"/>
        <!-- Subtle cyan pulse aura -->
        <circle cx="302" cy="268" r="10" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>

        <!-- Secondary telemetry trajectory line -->
        <path d="M204,335 Q245,365 285,330" fill="none" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3,3"/>
        <circle cx="285" cy="330" r="3" fill="#6EE7B7" filter="url(#neonGlow)"/>
      </g>
    </g>


    <!-- ==================== PENTAGON 2: TOP-LEFT (Analytics Teal with Waveforms) ==================== -->
    <g id="topLeftPentagonGroup">
      <path d="M116,68 L206,104 L148,188 L48,172 L46,88 Z" fill="url(#tealDarkPentGrad)" stroke="#14B8A6" stroke-width="3.5" stroke-linejoin="round"/>

      <g clip-path="url(#topLeftPentagonClip)">
        <!-- Flowing Organic Waveforms (Luminescent Teal & Cyan) -->
        <path d="M40,140 Q85,100 130,150 T195,110" fill="none" stroke="#2DD4BF" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M40,158 Q85,118 130,168 T195,128" fill="none" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
        <path d="M40,122 Q85,82 130,132 T195,92" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

        <!-- Telemetry Data Nodes -->
        <circle cx="70" cy="116" r="3.5" fill="#FFFFFF"/>
        <circle cx="104" cy="112" r="3" fill="#5EEAD4" filter="url(#neonGlow)"/>
        <circle cx="150" cy="148" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2" filter="url(#neonGlow)"/>
        <circle cx="180" cy="118" r="4.5" fill="#34D399" filter="url(#neonGlow)"/>

        <!-- Mini vertical telemetry needles -->
        <line x1="60" y1="165" x2="60" y2="148" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="68" y1="168" x2="68" y2="142" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="76" y1="170" x2="76" y2="135" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="84" y1="172" x2="84" y2="140" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>


    <!-- ==================== PENTAGON 3: TOP-RIGHT (Cobalt Pitch Radar & Passing Network) ==================== -->
    <g id="topRightPentagonGroup">
      <path d="M374,70 L452,112 L424,188 L330,182 L292,94 Z" fill="url(#cobaltDarkPentGrad)" stroke="#38BDF8" stroke-width="3.5" stroke-linejoin="round"/>

      <g clip-path="url(#topRightPentagonClip)">
        <!-- Natural Passing Map Arcs -->
        <path d="M310,125 Q360,105 410,140" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M335,165 Q375,130 435,120" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
        <path d="M320,150 Q365,160 400,165" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3,3"/>

        <!-- Connected Tactical Nodes -->
        <line x1="330" y1="120" x2="370" y2="145" stroke="#38BDF8" stroke-width="1.8"/>
        <line x1="370" y1="145" x2="415" y2="135" stroke="#38BDF8" stroke-width="1.8"/>

        <circle cx="330" cy="120" r="4" fill="#38BDF8" filter="url(#neonGlow)"/>
        <circle cx="370" cy="145" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" filter="url(#neonGlow)"/>
        <circle cx="415" cy="135" r="3.5" fill="#FFFFFF"/>
        <circle cx="390" cy="105" r="3" fill="#6EE7B7"/>
      </g>
    </g>


    <!-- ==================== PERIMETER EDGE PATCHES ==================== -->
    <!-- Far Left Perimeter Patch -->
    <path d="M14,242 C16,280 28,322 52,360 L78,326 L46,244 C34,242 22,242 14,242 Z" fill="#042F2E" stroke="#14B8A6" stroke-width="3"/>
    <circle cx="44" cy="300" r="3" fill="#2DD4BF" filter="url(#neonGlow)"/>

    <!-- Far Right Perimeter Patch -->
    <path d="M486,242 C484,280 472,322 448,360 L422,348 L448,272 C460,265 474,254 486,242 Z" fill="#082F49" stroke="#0284C7" stroke-width="3"/>
    <circle cx="456" cy="300" r="3" fill="#38BDF8" filter="url(#neonGlow)"/>

    <!-- Top Left Rim Cut -->
    <path d="M46,88 L116,68 L92,20 C64,36 40,60 22,90 Z" fill="#064E3B" stroke="#059669" stroke-width="3"/>

    <!-- Top Right Rim Cut -->
    <path d="M374,70 L452,112 L478,90 C458,58 430,34 398,20 Z" fill="#0369A1" stroke="#38BDF8" stroke-width="3"/>

  </g>

  <!-- High-Tech Neon Specular Highlight Arc -->
  <path d="M90,75 C140,36 215,26 295,36" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <path d="M100,78 C145,42 210,32 285,42" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>