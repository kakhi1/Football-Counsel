<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="aiBallSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050B18"/>
    </radialGradient>
    <linearGradient id="aiEmeraldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="aiCyanPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Outer AI Orbit / Sensor Ring -->
  <circle cx="50" cy="50" r="46" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="50" cy="50" r="43" fill="url(#aiBallSphere)" stroke="#334155" stroke-width="2.5"/>

  <!-- Tactical Ball Panel Seams (Curved perspective) -->
  <!-- Top apex seams -->
  <path d="M50 7 L50 25 M32 15 L42 28 M68 15 L58 28" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Side seams connecting to center pentagon -->
  <path d="M10 42 L26 40 M90 42 L74 40" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M18 72 L32 68 M82 72 L68 68" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M38 88 L50 78 L62 88" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top Pentagon (Neural / Telemetry node) -->
  <polygon points="50,22 62,31 57,44 43,44 38,31" fill="#0D9488" stroke="#2DD4BF" stroke-width="1.5" opacity="0.85"/>
  <circle cx="50" cy="33" r="2" fill="#FFFFFF" filter="url(#aiGlow)"/>

  <!-- Left Flank AI Node Patch -->
  <polygon points="19,46 29,43 33,56 25,65 16,58" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <line x1="22" y1="50" x2="28" y2="58" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="1 1"/>

  <!-- Right Flank AI Node Patch -->
  <polygon points="81,46 71,43 67,56 75,65 84,58" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <line x1="78" y1="50" x2="72" y2="58" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="1 1"/>

  <!-- Central Football Pentagon Synthesized with AI Brain / Chip & Tactical Bars -->
  <polygon points="50,47 67,59 61,79 39,79 33,59" fill="url(#aiEmeraldCore)" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>

  <!-- AI Synthesizer Micro-Architecture inside center pentagon -->
  <!-- Ascending mini statistical bars -->
  <rect x="40" y="66" width="3.5" height="8" rx="1" fill="#6EE7B7"/>
  <rect x="45.5" y="62" width="3.5" height="12" rx="1" fill="#34D399"/>
  <rect x="51" y="58" width="3.5" height="16" rx="1" fill="#38BDF8"/>
  <rect x="56.5" y="54" width="3.5" height="20" rx="1" fill="#0EA5E9" filter="url(#aiGlow)"/>

  <!-- Upward Trendline & AI Intelligence Apex Node -->
  <path d="M41 65 L47 61 L53 57 L58 53" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="58" cy="53" r="2.5" fill="#FFFFFF" filter="url(#aiGlow)"/>

  <!-- Consul AI Eye / Sensor Sparkle across the apex -->
  <path d="M78 22 Q83 17 88 22 Q83 27 78 22" fill="#38BDF8" filter="url(#aiGlow)"/>
  <circle cx="83" cy="22" r="1.5" fill="#FFFFFF"/>
</svg>
